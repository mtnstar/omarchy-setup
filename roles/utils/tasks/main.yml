---
- name: Install firmware update manager
  pacman:
    name:
      - fwupd
      - fwupd-efi
    state: present

- name: Ensure OverrideESPMountPoint is set in fwupd.conf
  ansible.builtin.lineinfile:
    path: /etc/fwupd/fwupd.conf
    regexp: '^#?\s*OverrideESPMountPoint='
    line: "OverrideESPMountPoint=/boot"
    insertafter: '^\[uefi_capsule\]'
  notify: restart fwupd

- name: Ensure EFI/arch directory exists on ESP
  ansible.builtin.file:
    path: /boot/EFI/arch
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install dns utils
  pacman:
    name:
      - bind
    state: present

- name: Install network utils
  pacman:
    name:
      - arp-scan
      - tcpdump
      - dnsmasq
      - nmap
    state: present

- name: Ensure dnsmasq service is stopped
  systemd:
    name: dnsmasq
    state: stopped
    enabled: false
